<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="calendar-container">
        <div class="header">
            <h2 id="month-year">Tháng 8, 2026</h2>
            <div class="header-right">
                <!-- Nút Đăng xuất dạng icon SVG -->                
                <button id="logout-google" title="Đồng bộ với Google" style="display: flex; align-items: center; gap: 6px; padding: 2px 6px;">
                    <!-- Thẻ chứa ảnh đại diện, ẩn mặc định khi chưa login -->
                    <img id="user-avatar" src="" alt="Avatar" style="width: 20px; height: 20px; border-radius: 50%; display: none; object-fit: cover;" />
                    
                    <!-- Icon SVG trạng thái -->
                    <svg id="icon-login-state" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </button>
                <div class="nav-buttons">
                    <button id="btn-prev">&#8592;</button>
                    <button id="btn-today">&#9679;</button>
                    <button id="btn-next">&#8594;</button>
                </div>
            </div>
        </div>

        <div class="weekdays">
            <div class="cyan">T2</div>
            <div class="cyan">T3</div>
            <div class="cyan">T4</div>
            <div class="cyan">T5</div>
            <div class="cyan">T6</div>
            <div class="orange">T7</div>
            <div class="red-sunday">CN</div>
        </div>

        <div class="days-grid" id="days-grid"></div>
    </div>

    <!-- Context Menu cho Task / Event / Cell -->
    <div id="custom-context-menu" class="context-menu" style="display: none;">
        <div id="ctx-add-task" class="context-menu-item">+ Task</div>
        <div id="ctx-add-event" class="context-menu-item">+ Event</div>
        <div id="ctx-toggle-status" class="context-menu-item" style="display: none;"></div>
        <div id="ctx-edit-item" class="context-menu-item" style="display: none;">Edit</div>
    </div>

    <!-- Modal nhập Title cho Task/Event -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Thêm mới</h3>
            <input type="text" id="modal-input-title" placeholder="Nhập tiêu đề..." autocomplete="off" />
            <textarea id="modal-input-desc" placeholder="Nhập mô tả (không bắt buộc)..." rows="3"></textarea>                        
            <div id="repeat-container" class="repeat-container">
                <label class="repeat-label">
                    <input type="checkbox" id="modal-checkbox-repeat"> Lặp lại (Repeat)
                </label>
                
                <div id="repeat-options" class="repeat-options">
                    <div class="repeat-row">
                        <select id="repeat-interval"></select>
                        <select id="repeat-unit">
                            <option value="days">Days</option>
                            <option value="weeks">Weeks</option>
                            <option value="months">Months</option>
                            <option value="years">Years</option>
                        </select>
                    </div>
                    <div class="repeat-row">
                        <span>End after</span>
                        <input type="number" id="repeat-times" min="1" max="100" value="3" />
                        <span>times</span>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="modal-btn-cancel">Cancel</button>
                <button id="modal-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="lunar.js"></script>
    <script src="popup.js"></script>
</body>
</html>
